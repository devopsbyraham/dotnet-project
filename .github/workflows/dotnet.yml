name: .NET-PROJECT

on:
workflow_dispatch:
inputs:
environment:
description: "Deployment Environment"
required: true
default: "dev"
type: choice
options:
- dev
- uat
- prod

env:
IMAGE_NAME: raham-dotnet

permissions:
id-token: write
contents: read

jobs:

build:

```
runs-on: ubuntu-latest

outputs:
  image_tag: ${{ github.sha }}

steps:

  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v5
    with:
      dotnet-version: 8.0.x

  - name: Restore Dependencies
    run: dotnet restore

  - name: Build Application
    run: dotnet build --no-restore

  - name: Run Unit Tests
    run: dotnet test --no-build --verbosity normal

  - name: Install Trivy
    uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

  - name: Run Trivy Scan
    uses: aquasecurity/trivy-action@v0.36.0
    with:
      scan-type: rootfs
      scan-ref: .
      severity: CRITICAL,HIGH
      ignore-unfixed: true

  - name: Login to DockerHub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USER }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build \
      -t ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

  - name: Push Docker Image
    run: |
      docker push \
      ${{ secrets.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
```

deploy:

```
needs: build

runs-on: ubuntu-latest

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Install kubectl
    uses: azure/setup-kubectl@v4

  - name: Configure EKS
    run: |
      aws eks update-kubeconfig \
      --region ${{ secrets.AWS_REGION }} \
      --name ${{ secrets.EKS_CLUSTER_NAME }}

  - name: Verify Cluster
    run: |
      kubectl get nodes

  - name: Deploy Application
    run: |
      kubectl apply -f deployment.yaml
      kubectl apply -f service.yaml

  - name: Verify Rollout
    run: |
      kubectl rollout status deployment/dotnet-app

  - name: Verify Resources
    run: |
      kubectl get pods
      kubectl get svc
```
